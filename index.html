<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Lisensi PowerPoint Remote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(18, 26, 44, 0.85);
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 2rem;
            max-width: 440px;
            width: 100%;
            z-index: 1;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .icon-badge {
            width: 52px;
            height: 52px;
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
            color: var(--accent-cyan);
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #fff;
        }

        p.subtitle {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 0.95rem;
            font-family: monospace;
            text-transform: uppercase;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--accent-cyan);
            color: #000;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .result-box {
            display: none;
            margin-top: 1.5rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .result-title {
            font-size: 0.7rem;
            color: var(--accent-green);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-key {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin: 8px 0;
            word-break: break-all;
            background: rgba(16, 185, 129, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed rgba(16, 185, 129, 0.4);
        }

        .btn-copy {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="card">
        <div class="header">
            <div class="icon-badge">
                <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1>Key Generator Lisensi</h1>
            <p class="subtitle">Generator Kunci Aktivasi PowerPoint Remote Sekolah</p>
        </div>

        <div class="input-group">
            <label for="machineIdInput">Kode Perangkat Laptop (Machine ID):</label>
            <input type="text" id="machineIdInput" placeholder="Contoh: SCH-7A8B-9C0D-1E2F" autocomplete="off" spellcheck="false">
        </div>

        <button class="btn" id="btnGenerate">⚡ Generate Kunci Aktivasi</button>

        <div class="result-box" id="resultBox">
            <span class="result-title">Kunci Aktivasi Resmi Khusus Laptop Tersebut:</span>
            <div class="result-key" id="resultKey">KEY-XXXX-XXXX-XXXX-XXXX</div>
            <button class="btn-copy" id="btnCopy">📋 Salin Kunci Aktivasi</button>
        </div>
    </div>

    <script>
        const SECRET_SALT = 'SDIT_POWERPOINT_REMOTE_SECRET_SALT_2026';

        // Web Crypto SHA-256 Helper
        async function sha256Hex(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        async function generateActivationKey(machineId) {
            if (!machineId) return '';
            const cleanId = machineId.trim().toUpperCase();
            const raw = cleanId + '_' + SECRET_SALT;
            const hash = await sha256Hex(raw);
            return `KEY-${hash.substring(0, 4)}-${hash.substring(4, 8)}-${hash.substring(8, 12)}-${hash.substring(12, 16)}`;
        }

        const machineIdInput = document.getElementById('machineIdInput');
        const btnGenerate = document.getElementById('btnGenerate');
        const resultBox = document.getElementById('resultBox');
        const resultKey = document.getElementById('resultKey');
        const btnCopy = document.getElementById('btnCopy');

        btnGenerate.addEventListener('click', async () => {
            const id = machineIdInput.value.trim();
            if (!id) {
                alert('Silakan masukkan Kode Perangkat Laptop terlebih dahulu.');
                return;
            }
            const key = await generateActivationKey(id);
            resultKey.textContent = key;
            resultBox.style.display = 'block';
        });

        btnCopy.addEventListener('click', () => {
            const keyText = resultKey.textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                const orig = btnCopy.innerHTML;
                btnCopy.innerHTML = '✅ Berhasil Disalin!';
                setTimeout(() => { btnCopy.innerHTML = orig; }, 2000);
            });
        });
    </script>
</body>
</html>
