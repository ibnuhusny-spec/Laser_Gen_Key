<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generator Lisensi PowerPoint Remote (Vercel Ready)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
        .card { background: #1e293b; border-radius: 24px; border: 1px solid #334155; padding: 28px 20px; width: 100%; max-width: 440px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        .badge { display: inline-block; padding: 6px 14px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; border: 1px solid rgba(56, 189, 248, 0.3); }
        h1 { font-size: 1.4rem; color: #ffffff; margin-bottom: 6px; font-weight: 800; }
        p.subtitle { font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.4; }
        .field { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px; background: #0f172a; border: 1.5px solid #475569; border-radius: 14px; color: #f8fafc; font-size: 1rem; font-family: monospace; outline: none; transition: border-color 0.2s; text-transform: uppercase; }
        input:focus { border-color: #38bdf8; }
        .btn-gen { width: 100%; padding: 15px; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 14px; color: #ffffff; font-size: 1rem; font-weight: 800; cursor: pointer; transition: transform 0.1s; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4); }
        .btn-gen:active { transform: scale(0.97); }
        .result-box { background: rgba(16, 185, 129, 0.12); border: 1.5px solid #10b981; border-radius: 16px; padding: 18px 14px; display: none; margin-top: 10px; }
        .result-title { font-size: 0.75rem; color: #34d399; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .result-key { font-family: monospace; font-size: 1.15rem; font-weight: 800; color: #10b981; letter-spacing: 1px; word-break: break-all; margin-bottom: 14px; background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid rgba(16, 185, 129, 0.3); }
        .btn-copy { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 10px; color: #ffffff; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
        .hint { font-size: 0.7rem; color: #64748b; margin-top: 16px; border-top: 1px solid #334155; padding-top: 12px; }
        .error-msg { color: #ef4444; font-size: 0.8rem; font-weight: 700; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🌐 VERCEL OFFICIAL KEYGEN</div>
        <h1>GENERATOR KODE LISENSI</h1>
        <p class="subtitle">Akses Khusus Admin (Terproteksi Password)</p>

        <!-- Step 1: Admin Password Form -->
        <div id="loginStep">
            <div class="field">
                <label for="txtAdminPassword">🔐 Password Admin:</label>
                <input type="password" id="txtAdminPassword" placeholder="Masukkan Password Admin..." style="text-transform: none;">
                <div class="error-msg" id="loginError">Password Admin Salah!</div>
            </div>
            <button class="btn-gen" onclick="verifyAdminPassword()">🔓 MASUK KE GENERATOR</button>
        </div>

        <!-- Step 2: Key Generator Form (Hidden until logged in) -->
        <div id="keygenStep" style="display: none;">
            <div class="field">
                <label for="txtMachineId">Kode Perangkat Teman (Machine ID):</label>
                <input type="text" id="txtMachineId" placeholder="Contoh: SCH-2C58-A0EF-8D2F" autocomplete="off" spellcheck="false">
            </div>

            <button class="btn-gen" onclick="handleGenerateKey()">✨ GENERATE KUNCI AKTIVASI</button>

            <div class="result-box" id="resultBox">
                <div class="result-title">Kunci Aktivasi Resmi Teman Anda:</div>
                <div class="result-key" id="resultKey">KEY-XXXX-XXXX-XXXX-XXXX</div>
                <button class="btn-copy" onclick="copyKey()">📋 Salin Kunci Aktivasi</button>
            </div>
        </div>

        <div class="hint">
            💡 Disertai Proteksi Admin & Normalisasi Otomatis Huruf 'O' dan Angka '0'.
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'SDIT2026';
        const SECRET_SALT = 'SDIT_POWERPOINT_REMOTE_SECRET_SALT_2026';

        // Check stored session
        if (localStorage.getItem('keygen_admin_authed') === 'true') {
            document.getElementById('loginStep').style.display = 'none';
            document.getElementById('keygenStep').style.display = 'block';
        }

        function verifyAdminPassword() {
            const pwd = document.getElementById('txtAdminPassword').value.trim();
            if (pwd === ADMIN_PASSWORD) {
                localStorage.setItem('keygen_admin_authed', 'true');
                document.getElementById('loginStep').style.display = 'none';
                document.getElementById('keygenStep').style.display = 'block';
                document.getElementById('loginError').style.display = 'none';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function normalizeKey(str) {
            if (!str) return '';
            return str.trim().toUpperCase().replace(/O/g, '0').replace(/I/g, '1');
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        }

        async function generateActivationKeyJS(machineId) {
            if (!machineId) return '';
            const cleanMachineId = normalizeKey(machineId);
            const raw = cleanMachineId + '_' + SECRET_SALT;
            const hash = await sha256(raw);
            const rawKey = `KEY-${hash.substring(0, 4)}-${hash.substring(4, 8)}-${hash.substring(8, 12)}-${hash.substring(12, 16)}`;
            return normalizeKey(rawKey);
        }

        async function handleGenerateKey() {
            const rawId = document.getElementById('txtMachineId').value.trim();
            if (!rawId) {
                alert('Silakan masukkan Kode Perangkat (Machine ID) laptop teman Anda terlebih dahulu!');
                return;
            }

            try {
                const generatedKey = await generateActivationKeyJS(rawId);
                document.getElementById('resultKey').textContent = generatedKey;
                document.getElementById('resultBox').style.display = 'block';
                if ('vibrate' in navigator) try { navigator.vibrate(40); } catch(e){}
            } catch (err) {
                alert('Terjadi kesalahan saat membuat kunci: ' + err.message);
            }
        }

        function copyKey() {
            const keyText = document.getElementById('resultKey').textContent;
            navigator.clipboard.writeText(keyText).then(() => {
                alert('Kunci Aktivasi berhasil disalin! Kirimkan kunci ini ke teman Anda.');
            });
        }
    </script>
</body>
</html>
